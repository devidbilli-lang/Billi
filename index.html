<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Richiesta Materiali (Valentano)</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ciano:#39e0f4;
  --ciano-scuro:#0ea5b8;
  --ciano-testo:#0b6d7c;
  --viola:#8635e7;
  --viola-scuro:#6020b4;
  --testo:#1a1a2e;
  --testo-2:#5b5b78;
  --bordo:#dfe6f0;
  --rosso:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Montserrat',system-ui,sans-serif;
  background:linear-gradient(135deg,#eef4fb 0%,#f8fafc 50%,#e6f7fa 100%) fixed;
  color:var(--testo);
  font-size:15px;
  line-height:1.4;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
[hidden]{display:none !important;}
:focus-visible{outline:3px solid var(--viola);outline-offset:2px;}
.pagina{max-width:1500px;margin:0 auto;padding:16px;}

/* ---------- intestazione ---------- */
.testata{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
  background:#fff;border:2px solid var(--ciano);border-radius:16px;
  padding:12px 20px;margin-bottom:18px;
  box-shadow:0 0 16px 2px rgba(57,224,244,0.4),0 0 40px 8px rgba(57,224,244,0.15);
}
.testata .logo{height:72px;width:auto;display:block;border-radius:10px;justify-self:start;}
.testata .centro{display:flex;align-items:center;gap:14px;min-width:0;}
.titolo{
  font-family:'Dancing Script',cursive;font-weight:700;font-size:50px;line-height:1;
  color:var(--ciano-scuro);white-space:nowrap;
  text-shadow:0 0 6px rgba(57,224,244,1),0 0 14px rgba(57,224,244,0.9),0 0 28px rgba(57,224,244,0.7),0 0 50px rgba(57,224,244,0.5);
}
.spirale{
  width:72px;height:72px;border-radius:50%;overflow:hidden;flex-shrink:0;
  box-shadow:0 4px 16px rgba(57,224,244,0.5),0 0 24px rgba(57,224,244,0.25);
}
.spirale img{width:100%;height:100%;object-fit:cover;display:block;}
.testata .destra{justify-self:end;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
.chip-linea{
  font-weight:800;font-size:14px;color:#fff;padding:8px 14px;border-radius:999px;
  background:linear-gradient(135deg,rgba(134,53,231,0.92),rgba(96,32,180,0.78));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 3px 12px rgba(134,53,231,0.4);
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ---------- pulsanti ---------- */
.btn{
  border-radius:12px;font-weight:800;font-size:14px;padding:11px 18px;letter-spacing:.2px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btn-ciano{
  background:linear-gradient(135deg,rgba(57,224,244,0.92),rgba(14,165,184,0.72));color:#06323a;
  border:1px solid rgba(14,165,184,0.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.65),0 2px 8px rgba(57,224,244,0.35);
}
.btn-viola{
  background:linear-gradient(135deg,rgba(134,53,231,0.95),rgba(96,32,180,0.85));color:#fff;
  border:1px solid rgba(96,32,180,0.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 3px 12px rgba(134,53,231,0.4);
}
.btn-chiaro{
  background:linear-gradient(135deg,rgba(255,255,255,0.85),rgba(255,255,255,0.5));color:var(--ciano-testo);
  border:1.5px solid rgba(57,224,244,0.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.92),0 2px 8px rgba(57,224,244,0.25);
}
.btn-chiaro.attivo{border-color:var(--viola);color:var(--viola-scuro);box-shadow:inset 0 1px 0 rgba(255,255,255,0.92),0 2px 10px rgba(134,53,231,0.3);}
.btn:hover:not([disabled]){filter:brightness(1.05);}

/* ---------- accesso ---------- */
.accesso{max-width:880px;margin:6vh auto 0;text-align:center;}
.accesso h1{font-size:26px;font-weight:800;margin-bottom:6px;}
.accesso .sotto{color:var(--testo-2);font-weight:500;margin-bottom:26px;}
.linee{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:26px;}
.linea-tile{
  flex:0 1 200px;min-height:86px;padding:18px 14px;border-radius:18px;font-size:17px;font-weight:800;line-height:1.25;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  background:linear-gradient(135deg,rgba(134,53,231,0.22),rgba(134,53,231,0.07));
  border:2px solid rgba(134,53,231,0.42);color:#6a26be;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.75),0 2px 12px rgba(134,53,231,0.22);
  transition:transform .1s ease,box-shadow .15s ease;
  overflow-wrap:anywhere;
}
.linea-tile:nth-child(even){
  background:linear-gradient(135deg,rgba(57,224,244,0.26),rgba(57,224,244,0.08));
  border-color:rgba(14,165,184,0.45);color:var(--ciano-testo);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.8),0 2px 12px rgba(57,224,244,0.25);
}
.linea-tile:hover{transform:translateY(-2px);}
.linea-tile.scelta{
  background:linear-gradient(135deg,rgba(134,53,231,0.92),rgba(96,32,180,0.75));border-color:rgba(96,32,180,0.7);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 6px 22px rgba(134,53,231,0.5);
}
.linea-tile:nth-child(even).scelta{
  background:linear-gradient(135deg,rgba(57,224,244,0.95),rgba(14,165,184,0.78));border-color:rgba(14,165,184,0.75);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.55),0 6px 22px rgba(57,224,244,0.5);
}
.pass-box{
  max-width:420px;margin:0 auto;padding:22px;border-radius:20px;text-align:left;
  background:linear-gradient(135deg,rgba(255,255,255,0.88),rgba(255,255,255,0.55));
  border:1.5px solid rgba(134,53,231,0.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 0 22px rgba(134,53,231,0.22);
}
.pass-box label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;}
.pass-riga{display:flex;gap:8px;}
.campo{
  width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bordo);background:#fff;
  font-size:16px;font-weight:600;
}
.campo:focus{outline:none;border-color:var(--viola);box-shadow:0 0 0 3px rgba(134,53,231,0.18);}
.occhio{flex-shrink:0;width:48px;border-radius:12px;border:1.5px solid var(--bordo);background:#fff;font-size:13px;font-weight:700;color:var(--testo-2);}
.pass-box .btn{width:100%;margin-top:14px;padding:13px;font-size:15px;}
.errore{
  margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px;
  background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;
}
.scuoti{animation:scuoti .32s ease;}
@keyframes scuoti{20%{transform:translateX(-7px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.avviso-vuoto{
  padding:26px 20px;border-radius:18px;font-weight:600;color:var(--testo-2);
  background:rgba(255,255,255,0.6);border:1.5px dashed rgba(57,224,244,0.6);
}
.avviso-vuoto b{display:block;color:var(--testo);font-size:17px;margin-bottom:6px;}
.avviso-vuoto .btn{margin-top:14px;}

/* ---------- negozio ---------- */
.negozio{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start;}
.barra{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.cerca{position:relative;flex:1 1 260px;max-width:520px;}
.cerca input{padding-right:40px;}
.cerca button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;background:none;font-size:20px;color:var(--testo-2);border-radius:8px;}
.conta{font-weight:700;color:var(--testo-2);font-size:14px;}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mat{
  display:flex;flex-direction:column;gap:10px;min-height:150px;padding:16px;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,0.86),rgba(255,255,255,0.5));
  border:1.5px solid rgba(57,224,244,0.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 2px 12px rgba(57,224,244,0.16);
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.mat.nel-carrello{
  border-color:rgba(134,53,231,0.75);
  background:linear-gradient(135deg,rgba(134,53,231,0.14),rgba(255,255,255,0.6));
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 4px 18px rgba(134,53,231,0.24);
}
.mat-su{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px;}
.cod{font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;background:#cdf6fb;color:#0c6b78;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.um{font-size:12px;font-weight:600;color:var(--testo-2);white-space:nowrap;}
.um b{font-weight:800;color:var(--testo);}
.mat-nome{font-size:16px;font-weight:800;line-height:1.25;flex:1;overflow-wrap:anywhere;}
.mat-az{display:flex;}
.mat-az .btn{width:100%;padding:10px;}

.passi{display:flex;align-items:center;width:100%;border-radius:12px;overflow:hidden;
  border:1.5px solid rgba(134,53,231,0.6);background:#fff;box-shadow:0 2px 10px rgba(134,53,231,0.18);}
.passi button{width:44px;height:42px;flex-shrink:0;border:none;font-size:22px;font-weight:800;line-height:1;color:#fff;
  background:linear-gradient(135deg,rgba(134,53,231,0.95),rgba(96,32,180,0.85));}
.passi button:hover{filter:brightness(1.1);}
.passi input{flex:1;min-width:0;height:42px;border:none;text-align:center;font-size:17px;font-weight:800;color:var(--viola-scuro);background:transparent;-moz-appearance:textfield;}
.passi input::-webkit-outer-spin-button,.passi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.passi input:focus{outline:none;background:rgba(134,53,231,0.08);}

/* ---------- carrello ---------- */
.carrello{
  position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px);
  border-radius:20px;padding:16px;
  background:linear-gradient(135deg,rgba(134,53,231,0.16),rgba(255,255,255,0.72));
  border:1.5px solid rgba(134,53,231,0.55);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 0 22px rgba(134,53,231,0.25),0 0 50px rgba(134,53,231,0.1);
}
.carrello-testa{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.carrello-testa h2{font-size:19px;font-weight:800;color:var(--viola-scuro);flex:1;}
.bollino{min-width:30px;height:30px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;background:var(--viola);box-shadow:0 2px 10px rgba(134,53,231,0.5);}
.bollino.salto{animation:salto .32s ease;}
@keyframes salto{40%{transform:scale(1.35);}100%{transform:scale(1);}}
.chiudi-carrello{display:none;width:36px;height:36px;border-radius:10px;border:1.5px solid rgba(134,53,231,0.4);background:#fff;font-size:20px;color:var(--viola-scuro);}
.carrello-lista{overflow-y:auto;margin:0 -4px;padding:0 4px;min-height:60px;}
.carrello-vuoto{padding:22px 10px;text-align:center;color:var(--testo-2);font-weight:600;}
.carrello-vuoto b{display:block;color:var(--viola-scuro);font-size:16px;margin-bottom:4px;}
.voce{display:grid;grid-template-columns:minmax(0,1fr) 132px 34px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(134,53,231,0.18);}
.voce:last-child{border-bottom:none;}
.voce-nome{font-weight:800;font-size:14px;line-height:1.25;overflow-wrap:anywhere;}
.voce-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--testo-2);margin-top:5px;}
.voce-info .cod{font-size:11px;padding:2px 7px;background:rgba(134,53,231,0.14);color:var(--viola-scuro);}
.voce .passi button{width:36px;height:36px;font-size:19px;}
.voce .passi input{height:36px;font-size:15px;}
.togli{width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:800;color:var(--rosso);
  background:linear-gradient(135deg,rgba(254,226,226,0.9),rgba(252,165,165,0.5));border:1px solid rgba(220,38,38,0.4);}
.carrello-form{margin-top:12px;padding-top:12px;border-top:1.5px solid rgba(134,53,231,0.3);display:grid;gap:10px;}
.carrello-form label{font-size:13px;font-weight:700;color:var(--viola-scuro);display:grid;gap:5px;}
.carrello-form .campo{font-size:15px;padding:10px 12px;border-color:rgba(134,53,231,0.35);}
.carrello-form textarea{resize:vertical;min-height:58px;max-height:140px;}
.carrello-form .btn{padding:14px;font-size:16px;}

.barra-carrello{display:none;}
/* durante l'invio la pagina non accetta tocchi: il carrello che parte e' quello che si vede */
body.invio .negozio,body.invio .barra-carrello,body.invio .testata .destra{pointer-events:none;}
body.invio .griglia,body.invio .carrello-lista{opacity:.55;}

/* ---------- le mie richieste ---------- */
.storico{max-width:900px;margin:0 auto;}
.storico-testa{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.storico-testa h1{font-size:22px;font-weight:800;}
.ric{
  padding:16px 18px;border-radius:18px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(255,255,255,0.88),rgba(255,255,255,0.55));
  border:1.5px solid rgba(57,224,244,0.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 2px 12px rgba(57,224,244,0.16);
}
.ric-su{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.ric-num{font-weight:800;font-size:16px;}
.ric-data{color:var(--testo-2);font-weight:600;font-size:13px;flex:1;}
.stato{font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap;}
.stato.in_attesa{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;}
.stato.evasa{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.stato.rifiutata{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
.ric-righe{list-style:none;display:grid;gap:6px;}
.ric-righe li{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;padding-bottom:6px;border-bottom:1px solid rgba(57,224,244,0.2);}
.ric-righe li:last-child{border-bottom:none;padding-bottom:0;}
.ric-righe .q{font-weight:800;white-space:nowrap;color:var(--viola-scuro);}
.ric-righe .q small{font-weight:700;color:var(--testo-2);}
.ric-nota{margin-top:10px;font-size:13px;font-weight:600;color:var(--testo-2);}
.ric-nota.rif{color:#b91c1c;}

/* ---------- conferma invio ---------- */
.velo{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(26,26,46,0.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.conferma{
  width:100%;max-width:430px;text-align:center;padding:30px 26px;border-radius:24px;background:#fff;
  border:2px solid var(--viola);box-shadow:0 0 26px rgba(134,53,231,0.5),0 20px 60px rgba(0,0,0,0.2);
}
.conferma svg{width:86px;height:86px;margin-bottom:10px;}
.conferma .cerchio{stroke:var(--viola);stroke-width:4;fill:rgba(134,53,231,0.1);}
.conferma .segno{stroke:var(--viola);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:segna .45s .15s ease forwards;}
@keyframes segna{to{stroke-dashoffset:0;}}
.conferma h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.conferma .num{display:inline-block;margin:6px 0 10px;font-size:18px;font-weight:800;padding:6px 16px;border-radius:999px;background:rgba(134,53,231,0.12);color:var(--viola-scuro);}
.conferma p{color:var(--testo-2);font-weight:600;margin-bottom:18px;}
.conferma .azioni{display:grid;gap:10px;}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;max-width:min(92vw,520px);
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;
  background:#fee2e2;color:#b91c1c;border:1.5px solid #fca5a5;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
.caricamento{text-align:center;padding:50px 20px;color:var(--testo-2);font-weight:700;}

/* ---------- schermi stretti ---------- */
@media (max-width:1100px){
  .titolo{font-size:38px;}
  .testata .logo,.spirale{height:56px;}
  .spirale{width:56px;}
}
@media (max-width:980px){
  .negozio{grid-template-columns:minmax(0,1fr);}
  .pagina{padding-bottom:96px;}
  .carrello{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;max-height:86vh;border-radius:22px 22px 0 0;
    background:linear-gradient(135deg,#efe4fd,#fbf8ff);
    transform:translateY(105%);transition:transform .25s ease;
    box-shadow:0 -10px 40px rgba(26,26,46,0.3);
  }
  .carrello.aperto{transform:translateY(0);}
  .chiudi-carrello{display:block;}
  .fondo-carrello{position:fixed;inset:0;z-index:49;background:rgba(26,26,46,0.45);}
  .barra-carrello{
    display:flex;align-items:center;gap:12px;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;
    padding:10px 10px 10px 16px;border-radius:18px;color:#fff;font-weight:800;
    background:linear-gradient(135deg,rgba(134,53,231,0.96),rgba(96,32,180,0.92));
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 8px 26px rgba(134,53,231,0.5);
    border:1px solid rgba(96,32,180,0.6);
  }
  .barra-carrello .testo{flex:1;font-size:15px;}
  .barra-carrello .bollino{background:#fff;color:var(--viola-scuro);}
  .barra-carrello .btn{background:#fff;color:var(--viola-scuro);border:none;padding:11px 16px;}
}
@media (max-width:980px){
  .testata{grid-template-columns:auto 1fr;gap:10px;}
  .testata .centro{justify-self:end;}
  .testata .destra{grid-column:1/-1;justify-self:stretch;justify-content:flex-end;}
  .testata .destra .chip-linea{margin-right:auto;}
}
@media (max-width:760px){
  .testata{padding:10px 12px;}
  .titolo{font-size:30px;}
  .testata .logo,.spirale{height:46px;}
  .spirale{width:46px;}
  .griglia{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .mat{padding:12px;min-height:138px;}
  .mat-nome{font-size:15px;}
  .accesso{margin-top:2vh;}
}
@media (max-width:480px){
  .titolo{font-size:23px;text-shadow:0 0 6px rgba(57,224,244,0.9),0 0 14px rgba(57,224,244,0.6);}
  .testata .logo,.spirale{height:38px;}
  .spirale{width:38px;}
  .testata .centro{gap:8px;}
  .linea-tile{flex:1 1 140px;min-height:68px;padding:12px 10px;font-size:15px;}
  .linee{gap:10px;margin-bottom:18px;}
  .accesso h1{font-size:22px;}
  .accesso .sotto{margin-bottom:18px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  .conferma .segno{stroke-dashoffset:0;}
}

    </div>
  </header>

  <!-- ACCESSO -->
  <main class="accesso" id="v-accesso" hidden>
    <h1>Scegli la tua linea</h1>
    <p class="sotto">Poi inserisci la password della linea per richiedere i materiali.</p>
    <div id="accesso-corpo"><div class="caricamento">Carico le linee…</div></div>
  </main>

  <!-- NEGOZIO -->
  <main class="negozio" id="v-negozio" hidden>
    <section aria-label="Materiali disponibili">
      <div class="barra">
        <div class="cerca">
          <input class="campo" id="cerca" type="search" placeholder="Cerca per nome o codifica" autocomplete="off" aria-label="Cerca materiale">
          <button type="button" id="cerca-x" aria-label="Cancella ricerca" hidden>×</button>
        </div>
        <span class="conta" id="conta"></span>
      </div>
      <div class="griglia" id="griglia"></div>
    </section>

    <div class="fondo-carrello" id="fondo-carrello" hidden></div>
    <aside class="carrello" id="carrello" aria-label="Carrello">
      <div class="carrello-testa">
        <h2>Carrello</h2>
        <span class="bollino" id="bollino">0</span>
        <button class="chiudi-carrello" id="chiudi-carrello" type="button" aria-label="Chiudi carrello">×</button>
      </div>
      <div class="carrello-lista" id="carrello-lista"></div>
      <div class="carrello-form" id="carrello-form">
        <label>Richiesto da
          <input class="campo" id="richiedente" type="text" maxlength="60" placeholder="Il tuo nome (facoltativo)" autocomplete="off">
        </label>
        <label>Note
          <textarea class="campo" id="note" maxlength="500" placeholder="Facoltative: urgenza, turno, dettagli"></textarea>
        </label>
        <button class="btn btn-viola" id="btn-invia" type="button">Invia richiesta</button>
      </div>
    </aside>
  </main>

  <!-- LE MIE RICHIESTE -->
  <main class="storico" id="v-storico" hidden>
    <div class="storico-testa">
      <h1>Le mie richieste</h1>
      <button class="btn btn-chiaro" id="btn-aggiorna" type="button">Aggiorna</button>
    </div>
    <div id="storico-lista"></div>
  </main>
</div>

<div class="barra-carrello" id="barra-carrello" hidden>
  <span class="bollino" id="bollino-barra">0</span>
  <span class="testo" id="testo-barra">Carrello vuoto</span>
  <button class="btn" id="apri-carrello" type="button">Vedi carrello</button>
</div>

<div class="velo" id="velo-conferma" hidden>
  <div class="conferma" role="dialog" aria-modal="true" aria-labelledby="conf-titolo">
    <svg viewBox="0 0 90 90" aria-hidden="true"><circle class="cerchio" cx="45" cy="45" r="40"/><path class="segno" d="M27 46 l12 12 l24 -26"/></svg>
    <h2 id="conf-titolo">Richiesta inviata</h2>
    <div class="num" id="conf-num"></div>
    <p id="conf-testo"></p>
    <div class="azioni">
      <button class="btn btn-viola" id="conf-nuova" type="button">Nuova richiesta</button>
      <button class="btn btn-chiaro" id="conf-storico" type="button">Vedi le mie richieste</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden role="alert"></div>

<script>
// Indirizzo del Worker: lo stesso dell'app principale
const API_URL = 'https://mc-vt-api.devid-billi.workers.dev';
const K_SESS = 'mcvt_linea_sessione';
const K_ULTIMA = 'mcvt_linea_ultima';
const QTA_MAX = 99999;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const mem = {
  get(store, k) { try { return JSON.parse(store.getItem(k)); } catch (_) { return null; } },
  set(store, k, v) { try { store.setItem(k, JSON.stringify(v)); } catch (_) {} },
  del(store, k) { try { store.removeItem(k); } catch (_) {} },
};

let linee = [];
let lineaScelta = null;      // id della linea scelta nella schermata di accesso
let sessione = null;         // { token, linea:{id,nome} }
let materiali = [];          // [{id, nome, numeroCodifica, um}]
let carrello = new Map();    // id materiale -> quantita'
let idemInvio = null;        // evita doppioni se l'invio viene ripetuto per un errore di rete
let invioInCorso = false;    // durante l'invio il carrello e' fermo: niente modifiche, niente secondo invio
let vista = 'negozio';

try { $('favicon').href = $('img-spirale').src; } catch (_) {}

// ---------- chiamate al server ----------
async function api(path, body) {
  let r;
  try {
    // body come testo semplice: nessuna richiesta preliminare del browser, funziona su ogni rete
    r = await fetch(API_URL + path, body === undefined ? { cache: 'no-store' } : { method: 'POST', body: JSON.stringify(body) });
  } catch (_) {
    throw new Error('Connessione non riuscita. Controlla la rete e riprova.');
  }
  let d;
  try { d = await r.json(); } catch (_) { throw new Error('Il server non ha risposto correttamente. Riprova tra poco.'); }
  if (d && d.ok === false && /Endpoint non trovato/i.test(d.error || '')) {
    throw new Error('Il servizio delle richieste non è ancora attivo. Avvisa chi gestisce il magazzino.');
  }
  return d;
}

let toastTimer = null;
function avvisa(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}

function mostra(quale) {
  $('v-accesso').hidden = quale !== 'accesso';
  $('v-negozio').hidden = quale !== 'negozio';
  $('v-storico').hidden = quale !== 'storico';
  const dentro = quale !== 'accesso';
  $('testata-destra').hidden = !dentro;
  if (dentro) {
    vista = quale;
    $('chip-linea').textContent = sessione.linea.nome;
    $('btn-vista').textContent = quale === 'storico' ? 'Torna ai materiali' : 'Le mie richieste';
    $('btn-vista').classList.toggle('attivo', quale === 'storico');
  }
  aggiornaConteggi();
  if (quale !== 'negozio') chiudiCarrello();
  window.scrollTo(0, 0);
}

// ---------- accesso ----------
async function caricaLinee() {
  const corpo = $('accesso-corpo');
  corpo.innerHTML = '<div class="caricamento">Carico le linee…</div>';
  try {
    const d = await api('/api/linee/elenco');
    if (!d.ok) throw new Error(d.error || 'Errore');
    linee = d.linee || [];
  } catch (e) {
    corpo.innerHTML = '<div class="avviso-vuoto"><b>Non riesco a caricare le linee</b>' + esc(e.message) +
      '<br><button class="btn btn-ciano" type="button" id="riprova-linee">Riprova</button></div>';
    $('riprova-linee').onclick = caricaLinee;
    return;
  }
  if (!linee.length) {
    corpo.innerHTML = '<div class="avviso-vuoto"><b>Nessuna linea configurata</b>' +
      'Chi gestisce il magazzino deve crearle dall’app, nella scheda Richieste, con “Linee e password”.</div>';
    return;
  }
  const ultima = mem.get(localStorage, K_ULTIMA);
  lineaScelta = linee.some((l) => l.id === ultima) ? ultima : (linee.length === 1 ? linee[0].id : null);
  disegnaAccesso();
}

function disegnaAccesso(errore) {
  const scelta = linee.find((l) => l.id === lineaScelta);
  let h = '<div class="linee">' + linee.map((l) =>
    '<button type="button" class="linea-tile' + (l.id === lineaScelta ? ' scelta' : '') + '" data-linea="' + l.id + '"' +
    ' aria-pressed="' + (l.id === lineaScelta) + '">' + esc(l.nome) + '</button>').join('') + '</div>';
  if (scelta) {
    h += '<form class="pass-box" id="form-accesso" autocomplete="off">' +
      '<label for="password">Password di ' + esc(scelta.nome) + '</label>' +
      '<div class="pass-riga">' +
        '<input class="campo" id="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>' +
        '<button class="occhio" type="button" id="occhio" aria-label="Mostra o nascondi la password">Mostra</button>' +
      '</div>' +
      (errore ? '<div class="errore" id="err-accesso">' + esc(errore) + '</div>' : '') +
      '<button class="btn btn-viola" type="submit" id="btn-entra">Entra</button>' +
    '</form>';
  }
  $('accesso-corpo').innerHTML = h;
  document.querySelectorAll('.linea-tile').forEach((b) => {
    b.onclick = () => { lineaScelta = Number(b.dataset.linea); disegnaAccesso(); };
  });
  if (scelta) {
    const p = $('password');
    $('occhio').onclick = () => {
      const visibile = p.type === 'text';
      p.type = visibile ? 'password' : 'text';
      $('occhio').textContent = visibile ? 'Mostra' : 'Nascondi';
      p.focus();
    };
    $('form-accesso').onsubmit = entra;
    if (errore) $('form-accesso').classList.add('scuoti');
    p.focus({ preventScroll: true });
    $('form-accesso').scrollIntoView({ block: 'nearest' });
  }
}

async function entra(ev) {
  ev.preventDefault();
  const btn = $('btn-entra');
  btn.disabled = true; btn.textContent = 'Controllo…';
  try {
    const d = await api('/api/linee/login', { lineaId: lineaScelta, password: $('password').value });
    if (!d.ok) { disegnaAccesso(d.error || 'Accesso non riuscito'); return; }
    sessione = { token: d.token, linea: d.linea };
    mem.set(sessionStorage, K_SESS, sessione);
    mem.set(localStorage, K_ULTIMA, d.linea.id);
    avviaNegozio(d.materiali || []);
  } catch (e) {
    disegnaAccesso(e.message);
  }
}

function esci(messaggio) {
  if (invioInCorso) return;
  sessione = null; materiali = []; carrello = new Map(); idemInvio = null;
  mem.del(sessionStorage, K_SESS);
  mostra('accesso');
  caricaLinee().then(() => { if (messaggio) avvisa(messaggio); });
}
function sessioneScaduta() { esci('Sessione scaduta: inserisci di nuovo la password.'); }

// ---------- negozio ----------
function chiaveCarrello() { return 'mcvt_carrello_' + sessione.linea.id; }
function chiaveNome() { return 'mcvt_richiedente_' + sessione.linea.id; }
function salvaCarrello() { mem.set(localStorage, chiaveCarrello(), [...carrello]); }

function avviaNegozio(mats) {
  materiali = mats;
  const validi = new Set(materiali.map((m) => m.id));
  carrello = new Map((mem.get(localStorage, chiaveCarrello()) || [])
    .filter((v) => Array.isArray(v) && validi.has(v[0]) && v[1] >= 1).map((v) => [v[0], Math.min(QTA_MAX, Math.floor(v[1]))]));
  $('richiedente').value = mem.get(localStorage, chiaveNome()) || '';
  $('note').value = '';
  $('cerca').value = ''; $('cerca-x').hidden = true;
  disegnaGriglia();
  disegnaCarrello();
  mostra('negozio');
}

function htmlPassi(id, q, nome) {
  return '<div class="passi">' +
    '<button type="button" data-meno="' + id + '" aria-label="Uno in meno di ' + esc(nome) + '">−</button>' +
    '<input type="number" inputmode="numeric" min="1" max="' + QTA_MAX + '" step="1" value="' + q + '" data-qta="' + id + '" aria-label="Quantità di ' + esc(nome) + '">' +
    '<button type="button" data-piu="' + id + '" aria-label="Uno in più di ' + esc(nome) + '">+</button>' +
  '</div>';
}
function htmlAzione(m) {
  const q = carrello.get(m.id);
  return q ? htmlPassi(m.id, q, m.nome)
    : '<button type="button" class="btn btn-ciano" data-aggiungi="' + m.id + '">Aggiungi</button>';
}

function disegnaGriglia() {
  const f = $('cerca').value.trim().toLowerCase();
  const visibili = materiali.filter((m) => !f || m.nome.toLowerCase().includes(f) || (m.numeroCodifica || '').toLowerCase().includes(f));
  const g = $('griglia');
  if (!materiali.length) {
    g.innerHTML = '<div class="avviso-vuoto" style="grid-column:1/-1"><b>Nessun materiale abilitato per questa linea</b>' +
      'Chiedi a chi gestisce gli ordini di aggiungerli da “Linee e password”.</div>';
  } else if (!visibili.length) {
    g.innerHTML = '<div class="avviso-vuoto" style="grid-column:1/-1"><b>Nessun materiale trovato</b>Prova con un altro nome o con la codifica.</div>';
  } else {
    g.innerHTML = visibili.map((m) =>
      '<article class="mat' + (carrello.has(m.id) ? ' nel-carrello' : '') + '" data-mat="' + m.id + '">' +
        '<div class="mat-su">' +
          (m.numeroCodifica ? '<span class="cod">' + esc(m.numeroCodifica) + '</span>' : '<span></span>') +
          (m.um ? '<span class="um">U.M. <b>' + esc(m.um) + '</b></span>' : '') +
        '</div>' +
        '<h3 class="mat-nome">' + esc(m.nome) + '</h3>' +
        '<div class="mat-az">' + htmlAzione(m) + '</div>' +
      '</article>').join('');
  }
  $('conta').textContent = materiali.length
    ? (f ? visibili.length + ' di ' + materiali.length + ' materiali' : materiali.length + (materiali.length === 1 ? ' materiale' : ' materiali'))
    : '';
}

function disegnaCarrello() {
  const lista = $('carrello-lista');
  if (!carrello.size) {
    lista.innerHTML = '<div class="carrello-vuoto"><b>Il carrello è vuoto</b>Aggiungi i materiali che servono alla linea.</div>';
  } else {
    lista.innerHTML = [...carrello].map(([id, q]) => {
      const m = materiali.find((x) => x.id === id) || { nome: 'Materiale', numeroCodifica: '', um: '' };
      const info = (m.numeroCodifica ? '<span class="cod">' + esc(m.numeroCodifica) + '</span>' : '') + (m.um ? '<span>U.M. ' + esc(m.um) + '</span>' : '');
      return '<div class="voce" data-voce="' + id + '">' +
        '<div><div class="voce-nome">' + esc(m.nome) + '</div>' + (info ? '<div class="voce-info">' + info + '</div>' : '') + '</div>' +
        htmlPassi(id, q, m.nome) +
        '<button type="button" class="togli" data-togli="' + id + '" aria-label="Togli ' + esc(m.nome) + ' dal carrello">×</button>' +
      '</div>';
    }).join('');
  }
  aggiornaConteggi();
}

function aggiornaConteggi(conSalto) {
  const n = carrello.size;
  ['bollino', 'bollino-barra'].forEach((id) => {
    const b = $(id);
    b.textContent = n;
    if (conSalto) { b.classList.remove('salto'); void b.offsetWidth; b.classList.add('salto'); }
  });
  $('testo-barra').textContent = n ? (n === 1 ? '1 materiale nel carrello' : n + ' materiali nel carrello') : 'Carrello vuoto';
  $('btn-invia').disabled = n === 0 || invioInCorso;
  $('barra-carrello').hidden = !(sessione && vista === 'negozio' && !$('v-negozio').hidden);
}

// Cambia la quantita' di un materiale. 0 = toglie dal carrello.
function impostaQta(id, q, origine) {
  if (invioInCorso) return;
  q = Math.max(0, Math.min(QTA_MAX, Math.floor(Number(q) || 0)));
  const cera = carrello.has(id);
  if (q === 0) carrello.delete(id); else carrello.set(id, q);
  idemInvio = null;
  salvaCarrello();
  if (cera !== carrello.has(id)) {
    // entra o esce dal carrello: ridisegna la sua scheda e l'elenco del carrello
    const scheda = document.querySelector('[data-mat="' + id + '"]');
    const m = materiali.find((x) => x.id === id);
    if (scheda && m) {
      scheda.classList.toggle('nel-carrello', carrello.has(id));
      scheda.querySelector('.mat-az').innerHTML = htmlAzione(m);
    }
    disegnaCarrello();
    aggiornaConteggi(carrello.has(id));
  } else {
    // solo la quantita': aggiorna i numeri gia' a schermo senza ridisegnare (non si perde il cursore)
    document.querySelectorAll('[data-qta="' + id + '"]').forEach((inp) => { if (inp !== origine) inp.value = q; });
  }
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-aggiungi],[data-piu],[data-meno],[data-togli]');
  if (!t) return;
  if (t.dataset.aggiungi) impostaQta(Number(t.dataset.aggiungi), 1);
  else if (t.dataset.piu) { const id = Number(t.dataset.piu); impostaQta(id, (carrello.get(id) || 0) + 1); }
  else if (t.dataset.meno) { const id = Number(t.dataset.meno); impostaQta(id, (carrello.get(id) || 0) - 1); }
  else if (t.dataset.togli) impostaQta(Number(t.dataset.togli), 0);
});
// Quantita' scritta a mano: vale mentre si scrive, si sistema quando si esce dal campo
document.addEventListener('input', (ev) => {
  const inp = ev.target.closest('input[data-qta]');
  if (!inp) return;
  const q = Math.floor(Number(inp.value));
  if (invioInCorso) { inp.value = carrello.get(Number(inp.dataset.qta)) || 1; return; }
  if (q >= 1) impostaQta(Number(inp.dataset.qta), q, inp);
});
document.addEventListener('change', (ev) => {
  const inp = ev.target.closest('input[data-qta]');
  if (!inp) return;
  const id = Number(inp.dataset.qta);
  const q = Math.floor(Number(inp.value));
  if (q >= 1) { impostaQta(id, q); inp.value = carrello.get(id); }
  else inp.value = carrello.get(id) || 1;   // campo svuotato o zero: resta la quantita' di prima
});

$('cerca').addEventListener('input', () => { $('cerca-x').hidden = !$('cerca').value; disegnaGriglia(); });
$('cerca-x').onclick = () => { $('cerca').value = ''; $('cerca-x').hidden = true; disegnaGriglia(); $('cerca').focus(); };
$('richiedente').addEventListener('change', () => { if (sessione) mem.set(localStorage, chiaveNome(), $('richiedente').value.trim()); });

function apriCarrello() { $('carrello').classList.add('aperto'); $('fondo-carrello').hidden = false; }
function chiudiCarrello() { $('carrello').classList.remove('aperto'); $('fondo-carrello').hidden = true; }
$('apri-carrello').onclick = apriCarrello;
$('chiudi-carrello').onclick = chiudiCarrello;
$('fondo-carrello').onclick = chiudiCarrello;

async function inviaRichiesta() {
  if (invioInCorso || !carrello.size) return;
  invioInCorso = true;
  document.body.classList.add('invio');
  const btn = $('btn-invia');
  btn.disabled = true; btn.textContent = 'Invio in corso…';
  if (!idemInvio) idemInvio = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const d = await api('/api/linee/richiesta', {
      token: sessione.token,
      idem: idemInvio,
      richiedente: $('richiedente').value.trim(),
      note: $('note').value.trim(),
      righe: [...carrello].map(([materialeId, qta]) => ({ materialeId, qta })),
    });
    if (d.sessione === false) { invioInCorso = false; sessioneScaduta(); return; }
    if (!d.ok) { avvisa(d.error || 'Invio non riuscito'); return; }
    mem.set(localStorage, chiaveNome(), $('richiedente').value.trim());
    carrello = new Map(); idemInvio = null; salvaCarrello();
    $('note').value = '';
    chiudiCarrello();
    disegnaGriglia(); disegnaCarrello();
    $('conf-num').textContent = d.numero;
    $('conf-testo').textContent = d.notifica
      ? 'Chi gestisce gli ordini della linea riceve la notifica via mail.'
      : 'Chi gestisce gli ordini la trova nell’elenco delle richieste.';
    $('velo-conferma').hidden = false;
    $('conf-nuova').focus();
  } catch (e) {
    avvisa(e.message);
  } finally {
    invioInCorso = false;
    document.body.classList.remove('invio');
    btn.textContent = 'Invia richiesta';
    btn.disabled = carrello.size === 0;
  }
}
$('btn-invia').onclick = inviaRichiesta;
$('conf-nuova').onclick = () => { $('velo-conferma').hidden = true; mostra('negozio'); };
$('conf-storico').onclick = () => { $('velo-conferma').hidden = true; apriStorico(); };

// ---------- le mie richieste ----------
const ETICHETTA = { in_attesa: 'In attesa', evasa: 'Evasa', rifiutata: 'Rifiutata' };
function dataOra(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' alle ' +
    d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}
async function apriStorico() {
  mostra('storico');
  const box = $('storico-lista');
  box.innerHTML = '<div class="caricamento">Carico le richieste…</div>';
  try {
    const d = await api('/api/linee/storico', { token: sessione.token });
    if (d.sessione === false) { sessioneScaduta(); return; }
    if (!d.ok) throw new Error(d.error || 'Errore');
    const lista = d.richieste || [];
    if (!lista.length) {
      box.innerHTML = '<div class="avviso-vuoto"><b>Ancora nessuna richiesta</b>Le richieste inviate dalla linea compaiono qui, con lo stato aggiornato.</div>';
      return;
    }
    box.innerHTML = lista.map((r) => {
      const righe = (r.righe || []).map((g) => {
        const um = g.um ? ' <small>' + esc(g.um) + '</small>' : '';
        let q = fmtN(g.qta) + um;
        if (r.stato === 'evasa' && g.qtaEvasa != null && g.qtaEvasa !== g.qta) {
          q = 'consegnati ' + fmtN(g.qtaEvasa) + ' su ' + fmtN(g.qta) + um;
        }
        return '<li><span>' + esc(g.materiale) + (g.numeroCodifica ? ' <small style="color:var(--testo-2)">(' + esc(g.numeroCodifica) + ')</small>' : '') + '</span><span class="q">' + q + '</span></li>';
      }).join('');
      return '<article class="ric">' +
        '<div class="ric-su"><span class="ric-num">' + esc(r.numero) + '</span>' +
        '<span class="ric-data">' + esc(dataOra(r.creataIl)) + (r.richiedente ? ', ' + esc(r.richiedente) : '') + '</span>' +
        '<span class="stato ' + esc(r.stato) + '">' + esc(ETICHETTA[r.stato] || r.stato) + '</span></div>' +
        '<ul class="ric-righe">' + righe + '</ul>' +
        (r.note ? '<div class="ric-nota">Note: ' + esc(r.note) + '</div>' : '') +
        (r.stato === 'rifiutata' && r.motivo ? '<div class="ric-nota rif">Motivo: ' + esc(r.motivo) + '</div>' : '') +
      '</article>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<div class="avviso-vuoto"><b>Non riesco a caricare le richieste</b>' + esc(e.message) + '</div>';
  }
}
$('btn-vista').onclick = () => { if (invioInCorso) return; if (vista === 'storico') mostra('negozio'); else apriStorico(); };
$('btn-aggiorna').onclick = apriStorico;
$('btn-esci').onclick = () => esci();
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') chiudiCarrello(); });

// ---------- avvio ----------
(async function avvio() {
  const salvata = mem.get(sessionStorage, K_SESS);
  if (salvata && salvata.token && salvata.linea) {
    sessione = salvata;
    try {
      const d = await api('/api/linee/catalogo', { token: sessione.token });
      if (d.ok) { sessione.linea = d.linea; avviaNegozio(d.materiali || []); return; }
    } catch (_) { /* rete assente: si riparte dall'accesso */ }
    sessione = null; mem.del(sessionStorage, K_SESS);
  }
  mostra('accesso');
  caricaLinee();
})();
</script>
